<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1170" viewBox="0 0 1280 1170" role="img" aria-labelledby="t d">
  <title id="t">brutalizr</title>
  <desc id="d">A Python class before and after brutalizr: every identifier is replaced with a swear word, the code still runs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a0d10"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f56"/>
      <stop offset="1" stop-color="#ffa657"/>
    </linearGradient>
    <style>
      .sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 25px; fill: #e6edf3; }
      .kw { fill: #ff7b72; }
      .num { fill: #79c0ff; }
      .fn { fill: #d2a8ff; }
      .id { fill: #a5d6ff; }
      .bad { fill: #ffa657; font-weight: 700; }
      .label { font-size: 17px; font-weight: 600; fill: #8b949e; }
      .chip { fill: #21262d; stroke: #30363d; }
      .chipt { font-size: 18px; fill: #c9d1d9; font-weight: 600; }
    </style>
  </defs>

  <rect width="1280" height="1170" fill="url(#bg)"/>

  <text x="640" y="112" text-anchor="middle" class="sans" font-size="92" font-weight="900" fill="url(#title)" letter-spacing="-3">brutalizr</text>
  <text x="640" y="168" text-anchor="middle" class="sans" font-size="29" fill="#c9d1d9">Rename every identifier in your codebase with swear words. It still runs.</text>

  <!-- languages -->
  <g class="sans" transform="translate(0 200)">
    <rect x="154" y="0" width="72" height="44" rx="22" class="chip"/><text x="190" y="28" text-anchor="middle" class="chipt">PHP</text>
    <rect x="240" y="0" width="100" height="44" rx="22" class="chip"/><text x="290" y="28" text-anchor="middle" class="chipt">Python</text>
    <rect x="354" y="0" width="136" height="44" rx="22" class="chip"/><text x="422" y="28" text-anchor="middle" class="chipt">JavaScript</text>
    <rect x="504" y="0" width="136" height="44" rx="22" class="chip"/><text x="572" y="28" text-anchor="middle" class="chipt">TypeScript</text>
    <rect x="654" y="0" width="82" height="44" rx="22" class="chip"/><text x="695" y="28" text-anchor="middle" class="chipt">Java</text>
    <rect x="750" y="0" width="64" height="44" rx="22" class="chip"/><text x="782" y="28" text-anchor="middle" class="chipt">C#</text>
    <rect x="828" y="0" width="298" height="44" rx="22" fill="#ff5f56" fill-opacity=".15" stroke="#ff5f56"/><text x="977" y="28" text-anchor="middle" class="chipt" fill="#ffa657">it · en · es · fr · de · nap</text>
  </g>

  <!-- before -->
  <g transform="translate(40 290)">
    <rect width="1200" height="384" rx="14" fill="#161b22" stroke="#30363d"/>
    <path d="M0 14a14 14 0 0 1 14-14h1172a14 14 0 0 1 14 14v34H0z" fill="#21262d"/>
    <circle cx="26" cy="24" r="7" fill="#ff5f56"/><circle cx="50" cy="24" r="7" fill="#ffbd2e"/><circle cx="74" cy="24" r="7" fill="#27c93f"/>
    <text x="600" y="30" text-anchor="middle" class="sans label">pipeline.py</text>
    <g class="mono">
      <text x="32" y="96"><tspan class="id">MAX_RETRIES</tspan> = <tspan class="num">3</tspan></text>
      <text x="32" y="172"><tspan class="kw">class</tspan> <tspan class="fn">DataPipeline</tspan>:</text>
      <text x="32" y="210">&#160;&#160;&#160;&#160;<tspan class="kw">def</tspan> <tspan class="fn">__init__</tspan>(self, <tspan class="id">source_name</tspan>, <tspan class="id">batch_size</tspan>=<tspan class="num">100</tspan>):</text>
      <text x="32" y="248">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;self.<tspan class="id">source_name</tspan> = <tspan class="id">source_name</tspan></text>
      <text x="32" y="286">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;self.<tspan class="id">batch_size</tspan> = <tspan class="id">batch_size</tspan></text>
      <text x="32" y="324">&#160;&#160;&#160;&#160;<tspan class="kw">def</tspan> <tspan class="fn">summary</tspan>(self):</text>
      <text x="32" y="362">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan class="id">started_at</tspan> = datetime.now() - timedelta(minutes=<tspan class="num">5</tspan>)</text>
    </g>
  </g>

  <!-- arrow -->
  <circle cx="640" cy="712" r="24" fill="#ff5f56"/>
  <path d="M640 700v24m-9-9 9 9 9-9" stroke="#0d1117" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="680" y="719" class="sans" font-size="20" font-weight="700" fill="#ffa657">brutalizr . -l it</text>

  <!-- after -->
  <g transform="translate(40 750)">
    <rect width="1200" height="384" rx="14" fill="#161b22" stroke="#ff5f56" stroke-opacity=".6"/>
    <path d="M0 14a14 14 0 0 1 14-14h1172a14 14 0 0 1 14 14v34H0z" fill="#21262d"/>
    <circle cx="26" cy="24" r="7" fill="#ff5f56"/><circle cx="50" cy="24" r="7" fill="#ffbd2e"/><circle cx="74" cy="24" r="7" fill="#27c93f"/>
    <text x="600" y="30" text-anchor="middle" class="sans label">pipeline.py · brutalized</text>
    <g class="mono">
      <text x="32" y="96"><tspan class="bad">MAIALONE_RIMBAMBITO</tspan> = <tspan class="num">3</tspan></text>
      <text x="32" y="172"><tspan class="kw">class</tspan> <tspan class="bad">CacasottoUnticcio</tspan>:</text>
      <text x="32" y="210">&#160;&#160;&#160;&#160;<tspan class="kw">def</tspan> <tspan class="fn">__init__</tspan>(self, <tspan class="bad">sfigato_incazzoso</tspan>, <tspan class="bad">coglione_fetido</tspan>=<tspan class="num">100</tspan>):</text>
      <text x="32" y="248">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;self.<tspan class="bad">sfigato_incazzoso</tspan> = <tspan class="bad">sfigato_incazzoso</tspan></text>
      <text x="32" y="286">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;self.<tspan class="bad">coglione_fetido</tspan> = <tspan class="bad">coglione_fetido</tspan></text>
      <text x="32" y="324">&#160;&#160;&#160;&#160;<tspan class="kw">def</tspan> <tspan class="bad">lordura_sfasciata</tspan>(self):</text>
      <text x="32" y="362">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan class="bad">lordura_moscia</tspan> = datetime.now() - timedelta(minutes=<tspan class="num">5</tspan>)</text>
    </g>
  </g>
</svg>
